name: Check Android member pilot
on:
  push:
    branches: [feature/h2o-android-member-pilot]
  pull_request:
    paths: ['native/android/**', 'native/shared/**', '.github/workflows/h2o-android-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile, lint and test Android app
        working-directory: native/android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: h2o-android-debug
          path: native/android/app/build/outputs/apk/debug/*.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          working-directory: native/android
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            mkdir -p ../../android-preview
            adb exec-out run-as de.feuerwehrwasser.h2o cat files/widget-small.png > ../../android-preview/widget-small.png
            adb exec-out run-as de.feuerwehrwasser.h2o cat files/widget-medium.png > ../../android-preview/widget-medium.png
            adb exec-out run-as de.feuerwehrwasser.h2o cat files/widget-empty.png > ../../android-preview/widget-empty.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2o-android-verification
          path: |
            android-preview/*.png
            native/android/app/build/reports/
            native/android/app/build/outputs/androidTest-results/
