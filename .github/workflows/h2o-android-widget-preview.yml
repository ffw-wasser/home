name: Render two Android widget design previews
on:
  pull_request:
    paths: ["native/android/**", ".github/workflows/h2o-android-widget-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build debug app and synthetic renderer
        run: gradle -p native/android :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render medium and compact widgets without live services
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r native/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r native/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class de.feuerwehrwasser.h2o.WidgetPreviewTest -e widgetPreviewOnly true de.feuerwehrwasser.h2o.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/h2o-widget-preview.txt"
            adb pull /sdcard/Android/data/de.feuerwehrwasser.h2o/files/widget-previews native/android/app/build/widget-design-previews
            grep -q 'OK (1 test)' "$RUNNER_TEMP/h2o-widget-preview.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2o-android-two-widget-previews
          path: native/android/app/build/widget-design-previews/*.png
          retention-days: 14
