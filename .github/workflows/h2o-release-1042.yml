name: Publish verified H2O member build 1042

# One-time execution for the explicitly authorized publication.
on:
  push:
    branches: [main]
    paths: [".github/workflows/h2o-release-1042.yml"]
permissions:
  contents: read
jobs:
  verify-release-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the exact tested build 1042 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin fc5edb707bebe0d5324e039bbe8ad9ae468996b4
          changed=$(git diff --name-only fc5edb707bebe0d5324e039bbe8ad9ae468996b4 HEAD)
          test "$changed" = ".github/workflows/h2o-release-1042.yml"
          grep -Eq 'CURRENT_PROJECT_VERSION: 1042$' native/ios/project.yml
          grep -Eq 'versionCode = 1042$' native/android/app/build.gradle.kts
          echo "Exact CI-tested build 1042 source verified."
  verify-ios-simulator:
    needs: verify-release-source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require the iPhone simulator check for the exact release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41993388762")
            jq -e '.head_sha == "fc5edb707bebe0d5324e039bbe8ad9ae468996b4"' <<< "$run" >/dev/null
            if jq -e '.status == "completed"' <<< "$run" >/dev/null; then
              jq -e '.conclusion == "success"' <<< "$run" >/dev/null
              exit 0
            fi
            sleep 30
          done
          echo "::error::iPhone simulator check did not complete within the release window."
          exit 1
  publish-member-pilot:
    needs: verify-ios-simulator
    uses: ./.github/workflows/h2o-ios-member-pilot.yml
    with:
      upload_to_testflight: true
    secrets: inherit
  sign-android:

    needs: verify-release-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      H2O_FIREBASE_APP_ID: ${{ vars.H2O_FIREBASE_APP_ID }}
      H2O_FIREBASE_API_KEY: ${{ vars.H2O_FIREBASE_API_KEY }}
      H2O_FIREBASE_PROJECT_ID: ${{ vars.H2O_FIREBASE_PROJECT_ID }}
      H2O_FIREBASE_SENDER_ID: ${{ vars.H2O_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build signed internal candidate without store upload
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.H2O_ANDROID_KEYSTORE_BASE64 }}
          H2O_ANDROID_STORE_PASSWORD: ${{ secrets.H2O_ANDROID_STORE_PASSWORD }}
          H2O_ANDROID_KEY_ALIAS: ${{ secrets.H2O_ANDROID_KEY_ALIAS }}
          H2O_ANDROID_KEY_PASSWORD: ${{ secrets.H2O_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          candidate_keystore="$RUNNER_TEMP/h2o-android-upload.jks"
          trap 'rm -f "$candidate_keystore"' EXIT
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$candidate_keystore"
          H2O_ANDROID_KEYSTORE="$candidate_keystore" H2O_REQUIRE_RELEASE_SIGNING=true gradle -p native/android :app:bundleRelease
          mkdir -p native/android/app/build/signed-release
          cp native/android/app/build/outputs/bundle/release/app-release.aab native/android/app/build/signed-release/H2O-Android-1042.aab
          jarsigner -verify native/android/app/build/signed-release/H2O-Android-1042.aab
      - uses: actions/upload-artifact@v4
        with:
          name: h2o-android-signed-1042
          path: native/android/app/build/signed-release/H2O-Android-1042.aab
          retention-days: 14
