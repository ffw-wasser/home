name: Build Android H2O app and widget
on:
  pull_request:
    paths: ["native/android/**", "native/shared/**", "cloudflare/push/android-push.js", ".github/workflows/h2o-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      H2O_FIREBASE_APP_ID: ${{ vars.H2O_FIREBASE_APP_ID }}
      H2O_FIREBASE_API_KEY: ${{ vars.H2O_FIREBASE_API_KEY }}
      H2O_FIREBASE_PROJECT_ID: ${{ vars.H2O_FIREBASE_PROJECT_ID }}
      H2O_FIREBASE_SENDER_ID: ${{ vars.H2O_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test and build development APK and unsigned store bundle
        run: gradle -p native/android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render synthetic widgets in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p native/android :app:connectedDebugAndroidTest
            adb pull /sdcard/Android/data/de.feuerwehrwasser.h2o/files/widget-previews native/android/app/build/widget-previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2o-android-build-and-tests
          path: |
            native/android/app/build/outputs/apk/debug/*.apk
            native/android/app/build/outputs/bundle/release/*.aab
            native/android/app/build/reports/
            native/android/app/build/widget-previews/
          retention-days: 14
