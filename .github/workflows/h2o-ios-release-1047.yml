name: Publish Apple H2O 1.0.3 build 1047

# Apple closed the approved 1.0.2 train. Re-upload the same widget code as 1.0.3.
on:
  push:
    branches: [main]
    paths: [".github/workflows/h2o-ios-release-1047.yml"]
permissions:
  contents: read
jobs:
  verify-release-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require only the version correction and successful exact-source checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tested_head=$(git rev-parse HEAD^2)
          git diff --exit-code "$tested_head" HEAD
          python3 - <<'PYVERIFY'
          import pathlib, subprocess
          base = '5b951cc3db2a994e62a6427871a20c539e8caa72'
          path = 'native/ios/project.yml'
          old = subprocess.check_output(['git', 'show', f'{base}:{path}'], text=True)
          assert old.count("MARKETING_VERSION: '1.0.2'") == 1
          assert pathlib.Path(path).read_text() == old.replace("MARKETING_VERSION: '1.0.2'", "MARKETING_VERSION: '1.0.3'")
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines())
          assert changed == {path, '.github/workflows/h2o-ios-release-1047.yml'}, changed
          print('Only the Apple marketing version changed; tested widget code and signed Android source are unchanged.')
          PYVERIFY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$tested_head&event=pull_request&per_page=100" > "$RUNNER_TEMP/h2o-apple-release-checks.json"
          python3 - "$RUNNER_TEMP/h2o-apple-release-checks.json" "$tested_head" <<'PYVERIFY'
          import json, sys
          runs = json.load(open(sys.argv[1]))['workflow_runs']
          for name in ['Check application changes', 'Build iPhone H2O widget prototype']:
              matches = [r for r in runs if r['name'] == name and r['head_sha'] == sys.argv[2]]
              assert matches, f'Missing check: {name}'
              run = max(matches, key=lambda r: r['id'])
              assert run['status'] == 'completed' and run['conclusion'] == 'success', f'Check not successful: {name}'
          PYVERIFY
          grep -Eq 'CURRENT_PROJECT_VERSION: 1047$' native/ios/project.yml
  publish-member-pilot:
    needs: verify-release-source
    uses: ./.github/workflows/h2o-ios-member-pilot.yml
    with:
      upload_to_testflight: true
    secrets: inherit
