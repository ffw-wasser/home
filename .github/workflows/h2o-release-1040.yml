name: Publish verified H2O member build 1040

# One-time execution for the explicitly authorized publication.
on:
  push:
    branches: [main]
    paths: [".github/workflows/h2o-release-1040.yml"]
permissions:
  contents: read
jobs:
  verify-release-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the exact tested build 1040 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 0b52af582625f1eca88b6142cf266c03d9828b60
          changed=$(git diff --name-only 0b52af582625f1eca88b6142cf266c03d9828b60 HEAD)
          test "$changed" = ".github/workflows/h2o-release-1040.yml"
          grep -Eq 'CURRENT_PROJECT_VERSION: 1040$' native/ios/project.yml
          grep -Eq 'versionCode = 1040$' native/android/app/build.gradle.kts
          echo "Exact CI-tested build 1040 source verified."
  publish-member-pilot:
    needs: verify-release-source
    uses: ./.github/workflows/h2o-ios-member-pilot.yml
    with:
      upload_to_testflight: true
    secrets: inherit
  sign-android:

    needs: verify-release-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      H2O_FIREBASE_APP_ID: ${{ vars.H2O_FIREBASE_APP_ID }}
      H2O_FIREBASE_API_KEY: ${{ vars.H2O_FIREBASE_API_KEY }}
      H2O_FIREBASE_PROJECT_ID: ${{ vars.H2O_FIREBASE_PROJECT_ID }}
      H2O_FIREBASE_SENDER_ID: ${{ vars.H2O_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build signed internal candidate without store upload
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.H2O_ANDROID_KEYSTORE_BASE64 }}
          H2O_ANDROID_STORE_PASSWORD: ${{ secrets.H2O_ANDROID_STORE_PASSWORD }}
          H2O_ANDROID_KEY_ALIAS: ${{ secrets.H2O_ANDROID_KEY_ALIAS }}
          H2O_ANDROID_KEY_PASSWORD: ${{ secrets.H2O_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          candidate_keystore="$RUNNER_TEMP/h2o-android-upload.jks"
          trap 'rm -f "$candidate_keystore"' EXIT
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$candidate_keystore"
          H2O_ANDROID_KEYSTORE="$candidate_keystore" H2O_REQUIRE_RELEASE_SIGNING=true gradle -p native/android :app:bundleRelease
          mkdir -p native/android/app/build/signed-release
          cp native/android/app/build/outputs/bundle/release/app-release.aab native/android/app/build/signed-release/H2O-Android-1040.aab
          jarsigner -verify native/android/app/build/signed-release/H2O-Android-1040.aab
      - uses: actions/upload-artifact@v4
        with:
          name: h2o-android-signed-1040
          path: native/android/app/build/signed-release/H2O-Android-1040.aab
          retention-days: 14
