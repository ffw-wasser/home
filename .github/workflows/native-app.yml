name: Build H2O native app preparation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/prepare-native-association.cjs'
      - 'tests/native-association.test.cjs'
      - '.github/workflows/native-app.yml'
permissions:
  contents: read
concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle -p native/android :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: h2o-android-development-only
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec native/ios/project.yml
      - name: Compile iPhone app and tests without distribution credentials
        run: xcodebuild build-for-testing -project native/ios/H2OPortal.xcodeproj -scheme H2OPortal -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath native/ios/build CODE_SIGNING_ALLOWED=NO
      - name: Run the same link policy tests with Apple Foundation without launching the app
        timeout-minutes: 5
        run: swift test --package-path native
      - uses: actions/upload-artifact@v4
        with:
          name: h2o-ios-simulator-only
          path: native/ios/build/Build/Products/Debug-iphonesimulator/H2OPortal.app
          retention-days: 7
