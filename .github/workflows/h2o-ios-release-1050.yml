name: Publish verified H2O iOS build 1050

# One-time execution for the explicitly authorized publication.
on:
  push:
    branches: [main]
    paths: [".github/workflows/h2o-ios-release-1050.yml"]
permissions:
  contents: read
jobs:
  verify-release-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact tested PR tree and successful application and iOS checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This publication is merged with a merge commit so parent 2 is the
          # exact PR head tested by Actions. Never publish a different tree.
          tested_head=$(git rev-parse HEAD^2)
          git diff --exit-code "$tested_head" HEAD
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$tested_head&event=pull_request&per_page=100" > "$RUNNER_TEMP/h2o-release-checks.json"
          python3 - "$RUNNER_TEMP/h2o-release-checks.json" "$tested_head" <<'PYVERIFY'
          import json, sys
          runs = json.load(open(sys.argv[1]))['workflow_runs']
          for name in ['Check application changes', 'Build iPhone H2O widget prototype']:
              matches = [r for r in runs if r['name'] == name and r['head_sha'] == sys.argv[2]]
              assert matches, f'Missing check: {name}'
              run = max(matches, key=lambda r: r['id'])
              assert run['status'] == 'completed' and run['conclusion'] == 'success', f'Check not successful: {name}'
          print('All release-source checks passed.')
          PYVERIFY
          grep -Eq 'CURRENT_PROJECT_VERSION: 1050$' native/ios/project.yml
  publish-member-pilot:
    needs: verify-release-source
    uses: ./.github/workflows/h2o-ios-member-pilot.yml
    with:
      upload_to_testflight: true
    secrets: inherit
