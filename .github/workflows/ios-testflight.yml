name: H2O iPhone TestFlight
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Signierten Build zu Apple TestFlight hochladen'
        type: boolean
        default: false
        required: true
  pull_request:
    paths:
      - '.github/workflows/ios-testflight.yml'
      - 'scripts/ios-signing.py'
      - 'scripts/ios-testflight.sh'
      - 'tests/ios_signing_test.py'
      - 'native/ios/**'
permissions:
  contents: read
concurrency:
  group: h2o-ios-testflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'ios_signing_test.py' -v
      - run: bash -n scripts/ios-testflight.sh
  signed-build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ffw-wasser/home'
    needs: validate
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Xcode supports current App Store uploads
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | awk '{if ($2+0 < 26) exit 1}'
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec native/ios/project.yml
      - name: Import and check signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: bash scripts/ios-testflight.sh prepare
      - name: Archive and export signed iPhone app
        run: bash scripts/ios-testflight.sh build
      - name: Keep signed IPA for inspection
        uses: actions/upload-artifact@v4
        with:
          name: h2o-ios-signed-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h2o-ios-export/H2OPortal.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload to Apple TestFlight
        if: inputs.upload
        env:
          H2O_UPLOAD_TESTFLIGHT: ${{ inputs.upload }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: bash scripts/ios-testflight.sh upload
      - name: Remove signing keys and profile
        if: always()
        run: bash scripts/ios-testflight.sh cleanup
