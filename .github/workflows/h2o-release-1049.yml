name: Publish verified H2O member build 1049

# One-time execution for the explicitly authorized publication.
on:
  push:
    branches: [main]
    paths: [".github/workflows/h2o-release-1049.yml"]
permissions:
  contents: read
jobs:
  verify-release-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact tested PR tree and all four successful checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This publication is merged with a merge commit so parent 2 is the
          # exact PR head tested by Actions. Never publish a different tree.
          tested_head=$(git rev-parse HEAD^2)
          git diff --exit-code "$tested_head" HEAD
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$tested_head&event=pull_request&per_page=100" > "$RUNNER_TEMP/h2o-release-checks.json"
          python3 - "$RUNNER_TEMP/h2o-release-checks.json" "$tested_head" <<'PYVERIFY'
          import json, sys
          runs = json.load(open(sys.argv[1]))['workflow_runs']
          for name in ['Check application changes', 'Build iPhone H2O widget prototype', 'Build Android H2O app and widget', 'Render two Android widget design previews']:
              matches = [r for r in runs if r['name'] == name and r['head_sha'] == sys.argv[2]]
              assert matches, f'Missing check: {name}'
              run = max(matches, key=lambda r: r['id'])
              assert run['status'] == 'completed' and run['conclusion'] == 'success', f'Check not successful: {name}'
          print('All release-source checks passed.')
          PYVERIFY
          grep -Eq 'CURRENT_PROJECT_VERSION: 1049$' native/ios/project.yml
          grep -Eq 'versionCode = 1049$' native/android/app/build.gradle.kts
  publish-member-pilot:
    needs: verify-release-source
    uses: ./.github/workflows/h2o-ios-member-pilot.yml
    with:
      upload_to_testflight: true
    secrets: inherit
  sign-android:

    needs: verify-release-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      H2O_FIREBASE_APP_ID: ${{ vars.H2O_FIREBASE_APP_ID }}
      H2O_FIREBASE_API_KEY: ${{ vars.H2O_FIREBASE_API_KEY }}
      H2O_FIREBASE_PROJECT_ID: ${{ vars.H2O_FIREBASE_PROJECT_ID }}
      H2O_FIREBASE_SENDER_ID: ${{ vars.H2O_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build signed internal candidate without store upload
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.H2O_ANDROID_KEYSTORE_BASE64 }}
          H2O_ANDROID_STORE_PASSWORD: ${{ secrets.H2O_ANDROID_STORE_PASSWORD }}
          H2O_ANDROID_KEY_ALIAS: ${{ secrets.H2O_ANDROID_KEY_ALIAS }}
          H2O_ANDROID_KEY_PASSWORD: ${{ secrets.H2O_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          candidate_keystore="$RUNNER_TEMP/h2o-android-upload.jks"
          trap 'rm -f "$candidate_keystore"' EXIT
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$candidate_keystore"
          H2O_ANDROID_KEYSTORE="$candidate_keystore" H2O_REQUIRE_RELEASE_SIGNING=true gradle -p native/android :app:bundleRelease
          mkdir -p native/android/app/build/signed-release
          cp native/android/app/build/outputs/bundle/release/app-release.aab native/android/app/build/signed-release/H2O-Android-1049.aab
          jarsigner -verify native/android/app/build/signed-release/H2O-Android-1049.aab
      - uses: actions/upload-artifact@v4
        with:
          name: h2o-android-signed-1049
          path: native/android/app/build/signed-release/H2O-Android-1049.aab
          retention-days: 14
