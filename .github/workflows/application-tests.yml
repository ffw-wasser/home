name: Check application changes
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
# Cancel superseded PR checks; keep every main-branch check intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: node scripts/check-syntax.cjs
      - name: Check bundled Cloudflare worker matches sources
        run: |
          node cloudflare/push/build.cjs
          git diff --exit-code -- cloudflare/push/worker.bundle.js
      - name: Check release and service worker consistency
        run: |
          node scripts/update-release.cjs
          git diff --exit-code -- index.html deckel.html service-worker.js manifest.webmanifest deckel.webmanifest deckel-android.webmanifest js/features/drinks/deckel-manifest.js
      - name: Validate focused-test groups
        run: node scripts/run-focused-tests.cjs --list
      - name: Run all unit tests
        run: node --test tests/*.test.cjs
