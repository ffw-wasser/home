name: Check application changes
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
# Cancel superseded PR checks; keep every main-branch check intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned build dependencies
        run: npm ci --ignore-scripts
      - name: Validate JavaScript syntax
        run: node scripts/check-syntax.cjs
      - name: Check bundled Cloudflare worker matches sources
        run: |
          node cloudflare/push/build.cjs
          git diff --exit-code -- cloudflare/push/worker.bundle.js js/vendor/passkeys-browser.js
      - name: Check release and service worker consistency
        run: |
          node scripts/update-release.cjs
          git diff --exit-code -- index.html deckel.html termin.html service-worker.js manifest.webmanifest deckel.webmanifest deckel-android.webmanifest js/features/drinks/deckel-manifest.js
      - name: Validate focused-test groups
        run: node scripts/run-focused-tests.cjs --list
      - name: Run all unit tests
        run: node --test tests/*.test.cjs
      - name: Install browser for passkey integration test
        run: npx playwright install --with-deps chromium
      - name: Test passkey browser flow with synthetic credentials
        run: node tests/passkey-browser.cjs
      - name: Test FFW update notice and safe reload
        run: node tests/app-update-browser.cjs
      - name: Test movable portal icon sizes
        run: node tests/portal-icons-browser.cjs
      - name: Test protected hydrant plan view
        run: node tests/portal-hydrants-browser.cjs
      - name: Test personal evidence and driver review
        run: node tests/portal-evidence-browser.cjs
      - name: Test member batch editing and mobile cards
        run: node tests/members-editor-browser.cjs
      - name: Test manual WhatsApp reminder flow on mobile viewports
        run: |
          node tests/portal-reminders-browser.cjs
          node tests/whatsapp-reply-browser.cjs
      - name: Test annual plan, navigation and private access
        run: |
          node tests/year-plan-browser.cjs
          node tests/portal-year-plan-browser.cjs
      - name: Test calendar keyword groups and recipient overrides
        run: node tests/calendar-groups-browser.cjs
      - name: Test calendar information, colors and read-only iPad sidebar
        run: node tests/calendar-display-browser.cjs
