name: Check application changes
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
# Cancel superseded PR checks; keep every main-branch check intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned build dependencies
        run: npm ci --ignore-scripts
      - name: Validate JavaScript syntax
        run: node scripts/check-syntax.cjs
      - name: Check illustrated guide matches its shared content
        run: node scripts/build-help-guide.cjs --check
      - name: Check bundled Cloudflare worker matches sources
        run: |
          node cloudflare/push/build.cjs
          git diff --exit-code -- cloudflare/push/worker.bundle.js js/vendor/passkeys-browser.js
      - name: Check release and service worker consistency
        run: |
          node scripts/update-release.cjs
          git diff --exit-code -- index.html deckel.html termin.html service-worker.js manifest.webmanifest deckel.webmanifest deckel-android.webmanifest js/features/drinks/deckel-manifest.js
      - name: Validate focused-test groups
        run: node scripts/run-focused-tests.cjs --list
      - name: Run all unit tests
        run: node --test tests/*.test.cjs
      - name: Install browser for passkey integration test
        timeout-minutes: 12
        run: |
          # The Azure HTTP mirror repeatedly stalls while downloading font packages.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium webkit
      - name: Capture and review all H2O portal screens
        env:
          PORTAL_REVIEW_OUTPUT: qa/portal-review
        run: node scripts/capture-help-screens.cjs --only=geraetehaus-backlog,geraetehaus-getraenkeverwaltung,geraetehaus-getraenke,geraetehaus-statistik,geraetehaus-auswertungen,h2o-install-iphone,h2o-install-android,h2o-anmeldung,h2o-jahresplan-laden,h2o-atemschutz,h2o-ausbildung,h2o-wettkampf,h2o-wettkampf-bronze,h2o-funkgeraet,h2o-termine,h2o-nachweise,h2o-deckel,h2o-mehr,h2o-dienstvorschriften,h2o-dienstvorschriften-buch,h2o-jahresplan,h2o-fussball,h2o-aktualisieren,h2o-qr-hochformat
      - name: Keep refreshed portal help screens for visual review
        uses: actions/upload-artifact@v4
        with:
          name: h2o-help-screens
          path: |
            assets/help/guide/*.jpg
            assets/help/guide/screens.json
          retention-days: 7
      - name: Keep whole-portal visual review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2o-design-review
          path: qa/portal-review
          retention-days: 7
      - name: Test passkey browser flow with synthetic credentials
        run: |
          node tests/passkey-browser.cjs
          node tests/portal-home-login-browser.cjs
          node tests/portal-qr-first-open-browser.cjs
      - name: Test password alternative with synthetic accounts
        run: node tests/password-browser.cjs
      - name: Test Google Calendar PKCE administration flow
        run: |
          node tests/google-calendar-oauth-browser.cjs
          BROWSER_ENGINE=webkit node tests/google-calendar-oauth-browser.cjs
      - name: Test H2O startup and resume transitions
        run: node tests/deckel-startup-browser.cjs
      - name: Test FFW update notice and safe reload
        run: node tests/app-update-browser.cjs
      - name: Test official regulations, PDF lifecycle and administration
        run: |
          node tests/portal-regulations-browser.cjs
          node tests/portal-regulations-integration-browser.cjs
      - name: Test public learning and documents after a real offline restart
        run: node tests/portal-offline-browser.cjs

      - name: Test private Google calendar import and credential handling
        run: |
          node tests/calendar-private-source-browser.cjs
          BROWSER_ENGINE=webkit node tests/calendar-private-source-browser.cjs
          TEST_PRIVATE_INITIAL_FAILURE=1 node tests/calendar-private-source-browser.cjs
          TEST_PRIVATE_INITIAL_FAILURE=1 BROWSER_ENGINE=webkit node tests/calendar-private-source-browser.cjs

      - name: Test private calendar invitations and consistent account sections
        run: |
          node tests/calendar-invitations-browser.cjs
          BROWSER_ENGINE=webkit node tests/calendar-invitations-browser.cjs

      - name: Test direct notification activation and settings layout
        run: |
          node tests/portal-notifications-browser.cjs
          node tests/portal-pull-refresh-browser.cjs
          node tests/portal-welcome-browser.cjs
          BROWSER_ENGINE=webkit node tests/portal-pull-refresh-browser.cjs

      - name: Test movable portal icon sizes
        run: node tests/portal-icons-browser.cjs
      - name: Test protected hydrant plan view
        run: node tests/portal-hydrants-browser.cjs
      - name: Test calendar and member invitation with uppercase OneDrive drive IDs
        run: node tests/portal-invitation-browser.cjs
      - name: Test personal evidence and driver review
        run: |
          node tests/portal-evidence-browser.cjs
          node tests/member-subscriptions-browser.cjs
          BROWSER_ENGINE=webkit node tests/member-subscriptions-browser.cjs
      - name: Test member batch editing and mobile cards
        run: node tests/members-editor-browser.cjs
      - name: Test appointment replies on mobile viewports
        run: |
          node tests/term-reply-browser.cjs
      - name: Test annual plan, navigation and private access
        run: |
          node tests/year-plan-browser.cjs
          node tests/portal-year-plan-browser.cjs
          H2O_TEST_BROWSER=webkit node tests/portal-year-plan-browser.cjs
      - name: Test calendar keyword groups and recipient overrides
        run: node tests/calendar-groups-browser.cjs
      - name: Test calendar information, colors and combined start card
        run: node tests/calendar-display-browser.cjs
      - name: Test calendar selection, incident tile and responsive home layout
        run: node tests/home-operation-browser.cjs
      - name: Test football favorites, cups and responsive views
        run: node tests/portal-bundesliga-browser.cjs
      - name: Test authenticated direct OneDrive folder conversion
        run: node tests/onedrive-direct-browser.cjs
      - name: Test local drafts, resume and administration tasks
        run: node tests/workflow-drafts-browser.cjs
      - name: Test QR attendance and full appointment layout
        run: node tests/qr-checkin-browser.cjs
      - name: Test privacy-first illustrated instructions on tablet and phone
        run: |
          node tests/contacts-browser.cjs
          node tests/help-guide-browser.cjs
      - name: Test home icon, administration cards and portal navigation
        run: |
          node tests/navigation-settings-browser.cjs
          node tests/drinks-admin-browser.cjs
      - name: Test commander statistics, documented readiness and fair participation
        run: node tests/statistics-dashboard-browser.cjs
      - name: Test auxiliary navigation, portal access, touch and event flows
        run: |
          node scripts/check-browser.cjs
          node scripts/check-portal-qr.cjs
          node scripts/check-portal-gestures.cjs
          node scripts/check-theater.cjs
          node scripts/check-theater-controls.cjs
      - name: Test readability at normal and doubled text size
        env:
          QA_STRICT: "1"
        run: |
          node scripts/check-readability.cjs
          QA_TEXT_SCALE=200 node scripts/check-readability.cjs

