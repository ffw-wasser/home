name: H2OPortal
options:
  bundleIdPrefix: de.feuerwehrwasser
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 1014
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VKL57X3H6F
    # Review is opt-in with H2O_REVIEW_FLAG=H2O_APP_REVIEW at build time.
targets:
  H2OPortal:
    type: application
    platform: iOS
    sources:
      - H2OPortal
      - Shared/WidgetSnapshot.swift
      - path: ../shared/ios-entry.js
        buildPhase: resources
      - path: ../shared/pdf-export.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.feuerwehrwasser.h2o
        INFOPLIST_FILE: H2OPortal/Info.plist
        H2O_APP_ENTITLEMENTS: H2OPortal/H2OPortal.entitlements
        CODE_SIGN_ENTITLEMENTS: '$(H2O_APP_ENTITLEMENTS)'
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) $(H2O_REVIEW_FLAG)'
        PROVISIONING_PROFILE_SPECIFIER: '$(H2O_APP_PROFILE_NAME)'
    dependencies:
      - target: H2OPortalWidget
        embed: true
  H2OPortalWidget:
    type: app-extension
    platform: iOS
    sources:
      - H2OPortalWidget
      - Shared/WidgetSnapshot.swift
      # Reuse the exact original H2O app icon (fire and water) as the widget logo.
      - path: H2OPortal/Assets.xcassets/AppIcon.appiconset/AppIcon.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.feuerwehrwasser.h2o.widget
        INFOPLIST_FILE: H2OPortalWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: H2OPortalWidget/H2OPortalWidget.entitlements
        PROVISIONING_PROFILE_SPECIFIER: '$(H2O_WIDGET_PROFILE_NAME)'
        TARGETED_DEVICE_FAMILY: '1,2'
  H2OPortalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [H2OPortalTests]
    dependencies:
      - target: H2OPortal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  H2OPortal:
    build:
      targets:
        H2OPortal: all
    test:
      targets: [H2OPortalTests]
