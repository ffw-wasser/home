name: H2OPortal
options:
  bundleIdPrefix: de.feuerwehrwasser
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 2
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VKL57X3H6F
targets:
  H2OPortal:
    type: application
    platform: iOS
    sources:
      - H2OPortal
      - path: ../shared/ios-entry.js
        buildPhase: resources
      - path: ../shared/pdf-export.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.feuerwehrwasser.h2o
        INFOPLIST_FILE: H2OPortal/Info.plist
        CODE_SIGN_ENTITLEMENTS: H2OPortal/H2OPortal.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  H2OPortalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [H2OPortalTests]
    dependencies:
      - target: H2OPortal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  H2OPortal:
    build:
      targets:
        H2OPortal: all
    test:
      targets: [H2OPortalTests]
