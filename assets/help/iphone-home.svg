  <text x="498" y="115" font-size="24" fill="#fff">Hinzufügen</text><text x="498" y="172" font-size="19">oben im Fenster</text>
  <text x="300" y="219" font-size="18" fill="#425a69">Safari-Menü · Darstellung vereinfacht</text>
