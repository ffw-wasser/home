 <g font-family="system-ui,sans-serif" fill="#142d40" text-anchor="middle">
  <text x="78" y="46" font-size="23" font-weight="700">1 · Menü</text><text x="226" y="46" font-size="23" font-weight="700">2 · Teilen</text><text x="374" y="46" font-size="20" font-weight="700">3 · Scrollen</text><text x="522" y="46" font-size="18" font-weight="700">4 · Hinzufügen</text>
  <g stroke="#d76615" stroke-width="3" fill="#fff7ed"><rect x="35" y="68" width="86" height="80" rx="14"/><rect x="183" y="68" width="86" height="80" rx="14"/></g>
  <path d="M54 95h48M54 117h32" fill="none" stroke="#164b64" stroke-width="6" stroke-linecap="round"/>
