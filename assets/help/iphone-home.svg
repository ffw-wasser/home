<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-labelledby="title description">
 <title id="title">H₂O in Safari zum Home-Bildschirm hinzufügen</title>
 <desc id="description">Zuerst unten in Safari das Seitenmenü mit den waagerechten Strichen öffnen. Dann Teilen wählen, im Menü nach unten zu Zu Home-Bildschirm hinzufügen scrollen und oben Hinzufügen bestätigen.</desc>
 <rect width="600" height="230" rx="18" fill="#e7edf2"/>
