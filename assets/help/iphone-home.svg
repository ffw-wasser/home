  <text x="78" y="177" font-size="20">Striche unten</text><text x="226" y="177" font-size="19">Quadrat + Pfeil</text>
  <path d="M374 73v27m-10-10 10 10 10-10" fill="none" stroke="#d76615" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="345" y="117" width="58" height="34" rx="8" fill="#164b64"/><path d="M360 134h28m-14-10v20" stroke="#fff" stroke-width="3"/>
