 <g font-family="system-ui,sans-serif" fill="#142d40" text-anchor="middle">
  <g font-size="25" font-weight="700"><text x="102" y="46">1 · Teilen</text><text x="300" y="46">2 · Scrollen</text><text x="498" y="46">3 · Bestätigen</text></g>
  <rect x="57" y="62" width="90" height="86" rx="16" fill="#fff7ed" stroke="#d76615" stroke-width="3"/>
  <path d="M79 101v29h46v-29M102 112V76m-13 13 13-13 13 13" fill="none" stroke="#164b64" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
